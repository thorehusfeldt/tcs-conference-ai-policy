[project]
name = "cfpdb"
version = "0.1.0"
description = "Policies of theoretical computer science conferences, collected from their calls for papers"
requires-python = ">=3.12"
dependencies = ["jinja2>=3.1", "pyyaml>=6.0"]

[project.scripts]
cfpdb-build = "cfpdb.build:main"
cfpdb-import-mail = "cfpdb.import_mail:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # no copyright header in every file
    "D203",   # prefer D211: no blank line before class docstring
    "D213",   # prefer D212: summary on the first docstring line
    "T201",   # command-line tools print
]
